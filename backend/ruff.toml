# Ruff lint configuration for the backend (used locally and in CI).
target-version = "py313"

[lint]
# Pin the rule set explicitly so a Ruff upgrade can't silently change what CI enforces:
# pycodestyle errors (E4/E7/E9) and Pyflakes (F).
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Package __init__ files re-export names on purpose (e.g. models/__init__.py
# imports every model so SQLAlchemy registers the tables).
"__init__.py" = ["F401"]
